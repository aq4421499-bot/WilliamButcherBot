services:
  - type: web
    name: group-help-bot
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python3 bot.py
    envVars:
      - key: BOT_TOKEN
        value: "your-telegram-bot-token"
      - key: API_ID
        value: "your-api-id"
      - key: API_HASH
        value: "your-api-hash"
      - key: MONGO_URI
        value: "your-mongodb-uri"
